name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Testbench, Pest, and laravel-doctrine/orm have matching major
          # versions that must be resolved together for older Laravel releases.
          - { php: '8.2', laravel: '^9.0', testbench: '^7.0', pest: '^2.0', orm: '^2.1' }
          - { php: '8.2', laravel: '^10.0', testbench: '^8.0', pest: '^2.0', orm: '^2.1' }
          - { php: '8.3', laravel: '^11.0', testbench: '^9.0', pest: '^3.1', orm: '^3.0' }
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', pest: '^3.1', orm: '^3.0' }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0', pest: '^3.1', orm: '^3.0' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-

      - name: Select dependency versions
        run: >-
          composer require --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "laravel-doctrine/orm:${{ matrix.orm }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint (Pint)
        run: composer lint -- --test

      - name: Run tests
        run: composer test
